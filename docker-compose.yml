version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: firewatch-tr-postgres
    environment:
      POSTGRES_USER: firewatch_user
      POSTGRES_PASSWORD: firewatch_password_123
      POSTGRES_DB: firewatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewatch_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: firewatch-tr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: firewatch-tr-app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://firewatch_user:firewatch_password_123@postgres:5432/firewatch_db
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data: